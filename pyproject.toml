[project]
name = "song-to-tab"
version = "0.1.0"
description = "Experiment: turn a recorded song into a playable guitar tab with off-the-shelf models"
requires-python = ">=3.11"
dependencies = [
    "basic-pitch>=0.4.0",
    "beartype>=0.22.9",
    "demucs>=4.0.1",
    "einops>=0.8.2",
    "hyper-connections>=0.4.11",
    "librosa>=0.11.0",
    "ml-collections>=1.1.0",
    "numpy<2",
    "omegaconf>=2.3.1",
    "onnxruntime>=1.30.0",
    "pretty-midi>=0.2.9",
    "rotary-embedding-torch>=0.9.1",
    "setuptools<81",
    "soundfile>=0.14.0",
    "torch>=2.2.2",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
    "tuttut>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
