name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only the light dependencies the unit tests import. No torch, no model downloads.
      - run: pip install "numpy<2" "pretty-midi>=0.2.9" "setuptools<81" pytest
      - run: python -m pytest -q
